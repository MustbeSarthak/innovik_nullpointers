[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MustbeSarthak", email = "https://github.com/MustbeSarthak" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.1.2",
    "chromadb>=1.5.9",
    "email-validator>=2.1.0",
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "numpy>=2.5.3",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.9.0",
    "pypdf>=6.18.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "sentence-transformers>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:backend.*"]
